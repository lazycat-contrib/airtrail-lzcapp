version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: airtrail
build:
  toolchains: []
  run_buildscript: false
images:
  - id: airtrail
    target: service
    service: airtrail
    source: johly/airtrail
    channel: custom
    sort: semver
    tag_regex: ^v(?P<version>[0-9]+[.][0-9]+[.][0-9]+)$
    version_regex: ^v(?P<version>[0-9]+[.][0-9]+[.][0-9]+)$
    version_template: "{version}"
    delivery:
      mode: mirror
      require_digest_match: true
  - id: db
    target: service
    service: db
    source: library/postgres
    channel: custom
    sort: semver
    # postgres publishes two-part tags (16.15); pad to three (koillection precedent)
    tag_regex: "^16[.][0-9]+$"
    version_regex: "^(?P<version>16[.][0-9]+)$"
    version_template: "{version}.0"
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
